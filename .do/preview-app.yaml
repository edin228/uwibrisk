# DigitalOcean App Platform spec for the redesign preview (preview.uwibrisk.com).
# Create with: Apps → Create App → "Import from app spec" (or `doctl apps create --spec .do/preview-app.yaml`).
# Secrets (RESEND_API_KEY etc.) are entered in the dashboard after import; never commit them.
name: uwibrisk-preview
region: nyc
services:
  - name: web
    github:
      repo: edin228/uwibrisk
      branch: astro-rebuild
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
    envs:
      # Astro's standalone server must listen on all interfaces inside the container.
      - key: HOST
        value: 0.0.0.0
        scope: RUN_TIME
      # Preview only: noindex every page + robots.txt "Disallow: /".
      - key: PREVIEW
        value: "true"
        scope: BUILD_TIME
      # Preview only: show draft coverage pages (with a "Draft" ribbon).
      - key: SHOW_DRAFTS
        value: "true"
        scope: BUILD_TIME
      # Form notification email (same values as the current site). Set in the dashboard.
      - key: RESEND_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: FORM_FROM_EMAIL
        scope: RUN_TIME
      - key: FORM_NOTIFICATION_TO
        scope: RUN_TIME
domains:
  - domain: preview.uwibrisk.com
    type: PRIMARY
